name: Rollback

# Puts an older tagged version back online without touching main.
# The next push to main deploys main again (roll forward with the fix).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to put back online (e.g. v1.0.0)
        required: true
      rules:
        description: Also deploy that version's Firestore rules and indexes (usually not — see README)
        type: boolean
        default: false

permissions:
  contents: read

# Same queue as the main deploy, so a rollback and a deploy never overlap.
concurrency:
  group: deploy-refs/heads/main
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Check tag format
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag: $TAG (expected vX.Y.Z)" >&2
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:rules
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_APP_TAGLINE: ${{ vars.VITE_APP_TAGLINE }}
      - name: Deploy to Firebase
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
          WITH_RULES: ${{ inputs.rules }}
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          printf '%s' "$SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          targets=hosting
          if [ "$WITH_RULES" = "true" ]; then targets=hosting,firestore:rules,firestore:indexes; fi
          npx firebase deploy --only "$targets" --project "$PROJECT_ID" --non-interactive
