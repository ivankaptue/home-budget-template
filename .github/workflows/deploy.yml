name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # A copy without its own Firebase project (fresh fork or template, PR from a fork) still runs every check and
      # builds with placeholder values, but never deploys. See SETUP.md, step 6.
      CONFIGURED: ${{ vars.VITE_FIREBASE_API_KEY != '' && vars.VITE_FIREBASE_PROJECT_ID != '' && vars.VITE_FIREBASE_MESSAGING_SENDER_ID != '' && vars.VITE_FIREBASE_APP_ID != '' && secrets.FIREBASE_SERVICE_ACCOUNT != '' && secrets.ALLOWED_EMAILS != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:rules
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || 'ci-placeholder' }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || 'ci-placeholder' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID || 'ci-placeholder' }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || 'ci-placeholder' }}
          VITE_APP_TAGLINE: ${{ vars.VITE_APP_TAGLINE }}
      - name: Not deployed (no Firebase configuration)
        if: env.CONFIGURED != 'true'
        run: echo "::notice::Checks passed, built with placeholder values; not deployed. To deploy, add the repository variables VITE_FIREBASE_* and the secrets FIREBASE_SERVICE_ACCOUNT and ALLOWED_EMAILS (SETUP.md, step 6)."
      - name: Deploy to Firebase
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CONFIGURED == 'true'
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          ALLOWED_EMAILS: ${{ secrets.ALLOWED_EMAILS }}
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          printf '%s' "$SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx firebase deploy --only hosting,firestore:rules,firestore:indexes --project "$PROJECT_ID" --non-interactive
